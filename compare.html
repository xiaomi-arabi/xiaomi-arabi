<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقارنات — شاومى عربى</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#FF6B00;--orange-light:#FF8C35;--orange-glow:rgba(255,107,0,0.15);--dark:#0A0A0F;--dark2:#111118;--dark3:#18181F;--dark4:#1E1E28;--text:#F0EEF8;--text-muted:#8E8CA0;--text-subtle:#5A5870;--border:rgba(255,107,0,0.15);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--dark);color:var(--text);direction:rtl;}
nav{position:fixed;top:0;width:100%;z-index:900;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;background:rgba(10,10,15,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.logo{font-size:1.3rem;font-weight:900;color:#fff;text-decoration:none;}
.logo span{color:var(--orange);}
.nav-links{display:flex;gap:8px;}
.nav-links a{color:var(--text-muted);text-decoration:none;font-size:0.88rem;font-weight:600;padding:8px 14px;border-radius:8px;transition:all 0.2s;}
.nav-links a:hover,.nav-links a.active{color:var(--orange);background:var(--orange-glow);}
.page-header{padding:120px 5% 60px;background:var(--dark2);border-bottom:1px solid var(--border);}
.page-header h1{font-size:2.5rem;font-weight:900;margin-bottom:10px;}
.page-header p{color:var(--text-muted);}
.compare-wrap{max-width:900px;margin:0 auto;padding:50px 5%;}
.selectors{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center;margin-bottom:40px;}
.device-select{background:var(--dark3);border:1px solid var(--border);border-radius:16px;padding:20px;}
.device-select h3{font-size:0.85rem;color:var(--text-muted);margin-bottom:12px;font-weight:600;}
.device-select select{width:100%;background:var(--dark4);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:0.95rem;cursor:pointer;outline:none;}
.vs-circle{width:50px;height:50px;background:var(--orange);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:0.9rem;color:#fff;margin:0 auto;}
.compare-btn{width:100%;background:var(--orange);color:#fff;border:none;padding:16px;border-radius:12px;font-family:'Cairo',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:all 0.3s;margin-bottom:40px;}
.compare-btn:hover{background:var(--orange-light);transform:translateY(-2px);}
.compare-table{background:var(--dark3);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:none;}
.compare-table.show{display:block;}
.table-header{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--dark4);padding:20px;}
.table-header div{text-align:center;font-weight:800;}
.table-header .spec-label{color:var(--text-muted);font-size:0.85rem;}
.table-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:16px 20px;border-top:1px solid rgba(255,107,0,0.08);align-items:center;}
.table-row:hover{background:rgba(255,107,0,0.03);}
.spec-label{color:var(--text-muted);font-size:0.88rem;font-weight:600;}
.spec-val{text-align:center;font-size:0.9rem;font-weight:700;}
.spec-val.winner{color:var(--orange);}
.winner-badge{display:inline-block;background:var(--orange);color:#fff;font-size:0.7rem;padding:2px 8px;border-radius:50px;margin-right:4px;}
.ad-slot{width:100%;border-radius:12px;border:1px dashed rgba(255,107,0,0.25);background:var(--dark3);display:flex;align-items:center;justify-content:center;height:90px;margin:20px 0;position:relative;}
.ad-slot::before{content:'إعلان';position:absolute;top:8px;right:12px;font-size:0.7rem;color:var(--text-subtle);}
footer{background:var(--dark);border-top:1px solid var(--border);padding:36px 5%;display:flex;align-items:center;justify-content:space-between;}
.footer-logo{font-size:1.2rem;font-weight:900;}
.footer-logo span{color:var(--orange);}
.footer-copy{font-size:0.8rem;color:var(--text-subtle);}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">شاومى <span>عربى</span></a>
  <div class="nav-links">
    <a href="index.html">الرئيسية</a>
    <a href="reviews.html">مراجعات</a>
    <a href="compare.html" class="active">مقارنات</a>
    <a href="news.html">أخبار</a>
    <a href="community.html">المجتمع</a>
  </div>
</nav>

<div class="page-header">
  <h1>⚖️ المقارنات</h1>
  <p>قارن بين أجهزة شاومى جنب بجنب فى ثوانى</p>
</div>

<div class="compare-wrap">
  <div class="ad-slot"><span style="font-size:0.8rem;color:var(--text-subtle);">728 × 90 — إعلان</span></div>

  <div class="selectors">
    <div class="device-select">
      <h3>الجهاز الأول</h3>
      <select id="dev1">
        <option value="a7pro">Redmi A7 Pro</option>
        <option value="14t">Xiaomi 14T</option>
        <option value="note13">Redmi Note 13 Pro</option>
        <option value="poco">Poco F6 Pro</option>
      </select>
    </div>
    <div class="vs-circle">VS</div>
    <div class="device-select">
      <h3>الجهاز التانى</h3>
      <select id="dev2">
        <option value="14t">Xiaomi 14T</option>
        <option value="a7pro">Redmi A7 Pro</option>
        <option value="note13">Redmi Note 13 Pro</option>
        <option value="poco">Poco F6 Pro</option>
      </select>
    </div>
  </div>

  <button class="compare-btn" onclick="compare()">⚡ قارن دلوقتى</button>

  <div class="compare-table" id="compareTable">
    <div class="table-header">
      <div class="spec-label">المواصفة</div>
      <div id="h1">—</div>
      <div id="h2">—</div>
    </div>
    <div id="tableBody"></div>
  </div>
</div>

<footer>
  <div class="footer-logo">شاومى <span>عربى</span></div>
  <div class="footer-copy">© 2026 جميع الحقوق محفوظة</div>
</footer>

<script>
const devices = {
  a7pro: { name:'Redmi A7 Pro', screen:'6.88" IPS LCD', cpu:'Helio G91', ram:'4GB', storage:'128GB', camera:'50MP', battery:'5000mAh', charge:'18W', price:'1,500 جنيه', rating:'7.5/10' },
  '14t':  { name:'Xiaomi 14T',   screen:'6.67" AMOLED 144Hz', cpu:'Dimensity 9300+', ram:'12GB', storage:'256GB', camera:'50MP Leica', battery:'5000mAh', charge:'67W', price:'12,000 جنيه', rating:'9.2/10' },
  note13: { name:'Redmi Note 13 Pro', screen:'6.67" AMOLED 120Hz', cpu:'Helio G99', ram:'8GB', storage:'256GB', camera:'200MP', battery:'5100mAh', charge:'67W', price:'7,500 جنيه', rating:'8.4/10' },
  poco:   { name:'Poco F6 Pro', screen:'6.67" AMOLED 144Hz', cpu:'Snapdragon 8 Gen 2', ram:'12GB', storage:'256GB', camera:'50MP', battery:'5000mAh', charge:'67W', price:'10,000 جنيه', rating:'8.9/10' },
};
const specs = [
  {key:'screen',label:'الشاشة'},
  {key:'cpu',label:'المعالج'},
  {key:'ram',label:'الرام'},
  {key:'storage',label:'التخزين'},
  {key:'camera',label:'الكاميرا'},
  {key:'battery',label:'البطارية'},
  {key:'charge',label:'سرعة الشحن'},
  {key:'price',label:'السعر'},
  {key:'rating',label:'التقييم'},
];
function compare() {
  const d1 = devices[document.getElementById('dev1').value];
  const d2 = devices[document.getElementById('dev2').value];
  document.getElementById('h1').textContent = d1.name;
  document.getElementById('h2').textContent = d2.name;
  let html = '';
  specs.forEach(s => {
    html += `<div class="table-row">
      <div class="spec-label">${s.label}</div>
      <div class="spec-val">${d1[s.key]}</div>
      <div class="spec-val">${d2[s.key]}</div>
    </div>`;
  });
  document.getElementById('tableBody').innerHTML = html;
  document.getElementById('compareTable').classList.add('show');
  document.getElementById('compareTable').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
